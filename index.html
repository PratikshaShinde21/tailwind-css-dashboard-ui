<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dashboard</title>
</head>
<body class="bg-gray-100">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <div class="bg-gray-800 text-white w-48 p-5">
            <h1 class="text-xl font-bold mb-8">Dashboard</h1>
            <p class="bg-blue-600 p-2 rounded mb-3">Home</p>
            <p class="p-2 mb-3">Users</p>
            <p class="p-2 mb-3">Products</p>
            <p class="p-2">Settings</p>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6">

            <h2 class="text-2xl font-bold mb-6">Welcome Back!</h2>

            <!-- Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                <div class="bg-white p-5 rounded-lg shadow">
                    <h3 class="text-gray-500">Users</h3>
                    <p class="text-3xl font-bold mt-2">120</p>
                </div>

                <div class="bg-white p-5 rounded-lg shadow">
                    <h3 class="text-gray-500">Products</h3>
                    <p class="text-3xl font-bold mt-2">85</p>
                </div>

                <div class="bg-white p-5 rounded-lg shadow">
                    <h3 class="text-gray-500">Orders</h3>
                    <p class="text-3xl font-bold mt-2">45</p>
                </div>

            </div>

            <!-- Recent Activity -->
            <div class="bg-white p-5 rounded-lg shadow mt-6">
                <h3 class="text-xl font-bold mb-4">Recent Activity</h3>
                <p class="border-b py-3">New user registered</p>
                <p class="border-b py-3">New product added</p>
                <p class="py-3">Order completed</p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
